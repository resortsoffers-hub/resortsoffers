<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elkhalfi – Avocats &amp; Conseil juridique | الخلفي للمحاماة والاستشارات القانونية</title>
  <meta name="description" content="Elkhalfi – Avocats &amp; Conseil juridique. Maître Amal El Khalfi et Maître Latifa El Khalfi : conseil et défense en droit marocain." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header" id="top">
    <div class="container nav">
      <a href="#top" class="brand" aria-label="Elkhalfi">
        <span class="brand-mark">E</span>
        <span class="brand-text"><span data-i18n="brand.name"></span><small data-i18n="brand.sub"></small></span>
      </a>
      <div class="nav-right">
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="fr">FR</button>
          <button data-lang="ar">ع</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
      <nav class="nav-links" aria-label="Main">
        <a href="#cabinet" data-i18n="nav.about"></a>
        <a href="#domaines" data-i18n="nav.areas"></a>
        <a href="#equipe" data-i18n="nav.team"></a>
        <a href="#contact" class="btn btn-small" data-i18n="nav.cta"></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero-actions">
          <a href="#contact" class="btn" data-i18n="hero.cta1"></a>
          <a href="#domaines" class="btn btn-ghost" data-i18n="hero.cta2"></a>
        </div>
        <ul class="hero-points">
          <li data-i18n="hero.p1"></li>
          <li data-i18n="hero.p2"></li>
          <li data-i18n="hero.p3"></li>
        </ul>
      </div>
    </section>

    <section class="section" id="cabinet">
      <div class="container about">
        <div class="about-text">
          <p class="eyebrow" data-i18n="about.eyebrow"></p>
          <h2 data-i18n="about.title"></h2>
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
        </div>
        <ul class="values">
          <li><strong data-i18n="v1.t"></strong><span data-i18n="v1.d"></span></li>
          <li><strong data-i18n="v2.t"></strong><span data-i18n="v2.d"></span></li>
          <li><strong data-i18n="v3.t"></strong><span data-i18n="v3.d"></span></li>
          <li><strong data-i18n="v4.t"></strong><span data-i18n="v4.d"></span></li>
        </ul>
      </div>
    </section>

    <section class="section section-alt" id="domaines">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-i18n="areas.eyebrow"></p>
          <h2 data-i18n="areas.title"></h2>
          <p data-i18n="areas.lead"></p>
        </div>
        <div class="cards" id="area-cards"></div>
      </div>
    </section>

    <section class="section" id="equipe">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-i18n="team.eyebrow"></p>
          <h2 data-i18n="team.title"></h2>
        </div>
        <div class="team">
          <article class="member">
            <div class="avatar" aria-hidden="true">AE</div>
            <div>
              <h3 data-i18n="amal.name"></h3>
              <p class="role" data-i18n="amal.role"></p>
              <p data-i18n="amal.bio"></p>
              <ul class="facts">
                <li data-i18n="amal.f1"></li>
                <li data-i18n="amal.f2"></li>
                <li data-i18n="amal.f3"></li>
              </ul>
            </div>
          </article>
          <article class="member">
            <div class="avatar" aria-hidden="true">LE</div>
            <div>
              <h3 data-i18n="latifa.name"></h3>
              <p class="role" data-i18n="latifa.role"></p>
              <p data-i18n="latifa.bio"></p>
              <ul class="facts">
                <li data-i18n="latifa.f1"></li>
                <li data-i18n="latifa.f2"></li>
                <li data-i18n="latifa.f3"></li>
              </ul>
            </div>
          </article>
        </div>
      </div>
    </section>

    <section class="section contact" id="contact">
      <div class="container contact-grid">
        <div class="contact-info">
          <p class="eyebrow" data-i18n="contact.eyebrow"></p>
          <h2 data-i18n="contact.title"></h2>
          <p data-i18n="contact.lead"></p>
          <ul class="contact-list">
            <li><span data-i18n="contact.address"></span><p data-i18n="contact.addressV"></p></li>
            <li><span data-i18n="contact.phone"></span><p data-i18n="contact.phoneV"></p></li>
            <li><span>WhatsApp</span><p data-i18n="contact.phoneV"></p></li>
            <li><span data-i18n="contact.email"></span><p data-i18n="contact.emailV"></p></li>
            <li><span data-i18n="contact.hours"></span><p data-i18n="contact.hoursV"></p></li>
          </ul>
          <!-- Map uses the street address for now; swap in the exact pin link when available. -->
          <div class="map">
            <iframe title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
              src="https://maps.google.com/maps?q=42%20rue%20Abdelkrim%20Diouri%2C%20Rabat%2C%20Maroc&z=16&output=embed"></iframe>
          </div>
          <a class="map-link" target="_blank" rel="noopener"
            href="https://www.google.com/maps/search/?api=1&query=42%20rue%20Abdelkrim%20Diouri%2C%20Rabat%2C%20Maroc"
            data-i18n="contact.map"></a>
        </div>
        <form class="contact-form" id="contact-form" novalidate>
          <div class="field">
            <label for="name" data-i18n="form.name"></label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="email" data-i18n="form.email"></label>
              <input id="email" name="email" type="email" autocomplete="email" required dir="ltr" />
            </div>
            <div class="field">
              <label for="phone" data-i18n="form.phone"></label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" dir="ltr" />
            </div>
          </div>
          <div class="field">
            <label for="topic" data-i18n="form.topic"></label>
            <select id="topic" name="topic"></select>
          </div>
          <div class="field">
            <label for="message" data-i18n="form.message"></label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <label class="check">
            <input type="checkbox" id="consent" required />
            <span data-i18n="form.consent"></span>
          </label>
          <button type="submit" class="btn btn-full" data-i18n="form.send"></button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <a href="#top" class="brand brand-light">
          <span class="brand-mark">E</span>
          <span class="brand-text"><span data-i18n="brand.name"></span><small data-i18n="brand.sub"></small></span>
        </a>
        <p class="footer-note" data-i18n="footer.bar"></p>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a href="#cabinet" data-i18n="nav.about"></a>
        <a href="#domaines" data-i18n="nav.areas"></a>
        <a href="#equipe" data-i18n="nav.team"></a>
        <a href="#contact" data-i18n="nav.contact"></a>
      </nav>
    </div>
    <div class="container disclaimer">
      <p data-i18n="footer.disclaimer"></p>
      <p>&copy; <span id="year"></span> <span data-i18n="brand.full"></span></p>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
